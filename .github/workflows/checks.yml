name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INV_STUDIO_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,cloud]'
      - run: python -m pytest -q
      - run: ruff check app tests scripts
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv && .venv/bin/pip install -e '.[test]'
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Run local application and browser checks
        run: |
          INV_STUDIO_DEMO_REFERENCES=1 INV_STUDIO_DATA="$RUNNER_TEMP/inv-studio-test" .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8765 --no-access-log > "$RUNNER_TEMP/inv-studio-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/health && break
            sleep 1
          done
          npm run test:browser
